<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryBot · Make an adventure</title><style>
:root{font-family:system-ui,sans-serif;color:#1c3156;background:#eaf2ff}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.5rem}h2{font-size:clamp(1.5rem,5vw,2.5rem);margin:8px 0}p{line-height:1.5}a{color:#294f99}section{background:white;border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 6px 22px #16346615;margin:18px 0}button,textarea{font:inherit}button{min-height:60px;border:2px solid #d3dff4;background:white;color:#1d3d78;border-radius:18px;padding:14px;cursor:pointer;font-weight:700}button:focus-visible,textarea:focus-visible{outline:4px solid #f6a928}button.selected{background:#dbe9ff;border-color:#2456af}button.primary{background:#2456af;color:white;border-color:#2456af}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.choice{min-height:100px;font-size:1.12rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.choice img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;max-height:180px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.nav button{min-width:125px}.muted{color:#526783}.steps{font-weight:700;color:#365c9e}textarea{width:100%;min-height:130px;padding:16px;border:2px solid #b6c9ea;border-radius:16px;font-size:1.1rem}#status{padding:14px;background:#eaf2ff;border-radius:12px}progress{width:100%;height:22px}small{color:#526783} [hidden]{display:none!important}.adventure-scene{position:relative;overflow:hidden;min-height:270px;border-radius:22px;background:linear-gradient(#283d83 0%,#6976ba 64%,#c4a9d5 100%);margin:14px 0;color:white;text-align:center}.adventure-moon{position:absolute;right:11%;top:10%;width:66px;height:66px;border-radius:50%;background:#fff3c4;box-shadow:0 0 35px #fff2c48a}.adventure-stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1.5px,transparent 2px);background-size:55px 49px;animation:twinkle 4s ease-in-out infinite alternate}.adventure-city{position:absolute;bottom:0;width:100%;height:90px;background:linear-gradient(90deg,#25345e 0 12%,#35487a 12% 21%,#25345e 21% 37%,#405087 37% 49%,#25345e 49% 63%,#35487a 63% 76%,#25345e 76% 100%);clip-path:polygon(0 25%,12% 25%,12% 0,21% 0,21% 40%,37% 40%,37% 15%,49% 15%,49% 35%,63% 35%,63% 5%,76% 5%,76% 28%,100% 28%,100% 100%,0 100%)}.adventure-hero{position:absolute;left:calc(50% - 45px);bottom:46px;font-size:80px;animation:hero-bob 3.2s ease-in-out infinite;filter:drop-shadow(0 5px 5px #17234b88)}.adventure-brick{position:absolute;bottom:36px;left:22%;font-size:40px;animation:brick-float 5s ease-in-out infinite}.adventure-brick.second{left:auto;right:20%;animation-delay:-2s}.adventure-caption{position:absolute;top:12px;left:10px;right:10px;font-weight:800;font-size:1.1rem;text-shadow:0 2px 6px #15234d}.adventure-scene.paused *{animation-play-state:paused!important}@keyframes twinkle{to{opacity:.35}}@keyframes hero-bob{50%{transform:translateY(-15px) rotate(-3deg)}}@keyframes brick-float{50%{transform:translateY(-28px) rotate(8deg)}}@media(prefers-reduced-motion:reduce){.adventure-scene *{animation:none!important}}
</style></head><body><main><header><h1>📖 StoryBot</h1><a href="/parent">🔒 Grown-ups</a></header><section><p class="steps" id="step-label">Step 1 of 4</p><h2 id="heading">Choose your Tonie 🎧</h2><p class="muted" id="help">Which Tonie will hold your adventure?</p><div id="choices" class="grid"></div><div id="idea-panel" hidden><textarea id="idea" placeholder="Tell us what happens in your adventure..."></textarea><div class="nav"><button id="speak">🎙 Speak my idea</button><button id="surprise">✨ Surprise me!</button></div><small>You can type, speak, or choose a surprise adventure.</small></div><div id="progress-panel" hidden><div class="adventure-scene" id="adventure-scene" role="img" aria-label="Gentle night-time Bricksburg with a bobbing superhero and floating toy bricks"><div class="adventure-stars"></div><div class="adventure-moon"></div><div class="adventure-city"></div><div class="adventure-brick">🧱</div><div class="adventure-brick second">✨</div><div class="adventure-hero">🦸</div><div class="adventure-caption" id="adventure-caption">Building your adventure...</div></div><button id="pause-animation" type="button" aria-pressed="false">⏸ Pause animation</button><p id="progress-stage">Getting your adventure ready...</p><progress id="progress" max="8000" value="0"></progress><p id="count">0 / 8,000 characters</p></div><p id="status" role="status">Let's make a bedtime adventure!</p><div class="nav"><button id="back">← Back</button><button id="next" class="primary">Next →</button></div></section></main>
<script>
let theme,tonies=[],step=0,toneId='',core=[],guests=[],villains=[],autoVillain=false,recognition=null;
const $=id=>document.getElementById(id);
const steps=[['Choose your Tonie 🎧','Which Tonie will hold your adventure?'],['Pick your superhero friends 🦸','Archie is always the main hero! Choose up to 3 best friends.'],['Choose some silly troublemakers 🦹','Choose up to 3 silly villains.'],['What happens in your adventure? 🌟','Tell us an idea, or let StoryBot surprise you!']];
$('pause-animation').onclick=()=>{const paused=$('adventure-scene').classList.toggle('paused');$('pause-animation').textContent=paused?'▶ Resume animation':'⏸ Pause animation';$('pause-animation').setAttribute('aria-pressed',String(paused));};
function status(s){$('status').textContent=s;}
function tile(label,active,fn,imageUrl=''){const b=document.createElement('button');b.className='choice'+(active?' selected':'');if(imageUrl){const img=document.createElement('img');img.src=imageUrl;img.alt='';img.loading='lazy';b.append(img);}const caption=document.createElement('span');caption.textContent=label;b.append(caption);b.setAttribute('aria-pressed',String(active));b.onclick=fn;return b;}
function render(){
 $('step-label').textContent='Step '+(step+1)+' of 4';$('heading').textContent=steps[step][0];$('help').textContent=steps[step][1];
 $('choices').hidden=step===3;$('idea-panel').hidden=step!==3;$('progress-panel').hidden=true;
 $('back').hidden=step===0;$('next').textContent=step===3?'✨ Make my story!':'Next →';
 const choices=[];
 if(step===0)for(const t of tonies)choices.push(tile('🎧 '+t.name,toneId===t.id,()=>{toneId=t.id;render();}));
 if(step===1){
  const heroes=theme.characters.filter(c=>c.role==='hero'&&c.id!=='archie');
  for(const c of heroes)choices.push(tile('🦸 '+c.name,core.includes(c.id)||guests.includes(c.id),()=>{
   if(core.includes(c.id))core=core.filter(x=>x!==c.id);
   else if(guests.includes(c.id))guests=guests.filter(x=>x!==c.id);
   else if(core.length<3)core.push(c.id);
   else if(guests.length<4)guests.push(c.id);
   else {status('You have picked the maximum number of friends.');return;}
   render();
  },c.imageUrl));
 }
 if(step===2){
  for(const c of theme.characters.filter(c=>c.role==='villain'))choices.push(tile('🦹 '+c.name,villains.includes(c.id),()=>{
   if(villains.includes(c.id))villains=villains.filter(x=>x!==c.id);
   else if(villains.length+(autoVillain?1:0)<3)villains.push(c.id);
   else {status('Choose up to three villains.');return;}render();
  },c.imageUrl));
  choices.push(tile('✨ Surprise villain',autoVillain,()=>{if(!autoVillain&&villains.length>=3){status('Choose up to three villains.');return;}autoVillain=!autoVillain;render();}));
 }
 $('choices').replaceChildren(...choices);
}
$('back').onclick=()=>{if(step>0){step--;render();status('Choose what you like!');}};
$('next').onclick=async()=>{
 if(step===0&&!toneId)return status('Choose your Tonie first.');
 if(step===1&&core.length+guests.length<1)return status('Choose at least one superhero friend.');
 if(step===2&&villains.length+(autoVillain?1:0)<1)return status('Choose a silly villain or a surprise villain.');
 if(step<3){step++;render();status('Looking good!');return;}
 const idea=$('idea').value.trim()||'A gentle surprise adventure in Bricksburg with a happy bedtime ending.';
 const selected=[...core,...guests];const heroGuests=selected.slice(Math.min(3,selected.length));
 const heroCore=selected.slice(0,Math.min(3,selected.length));
 if(heroGuests.length===0&&heroCore.length>0){heroGuests.push(heroCore.pop());}
 const payload={toneId,coreHeroes:heroCore,heroes:heroGuests,villains,autoVillain,idea,minutes:7};
 $('next').disabled=true;$('back').disabled=true;$('idea-panel').hidden=true;$('progress-panel').hidden=false;
 $('adventure-caption').textContent='Building your adventure...';
 status('Your story is being written. This may take a little while!');
 try{
  const response=await fetch('/api/story/stream',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
  if(!response.ok){const data=await response.json();throw Error(data.error||'Unable to start');}
  const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',completed=false;
  while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let i;
   while((i=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,i).trim();buffer=buffer.slice(i+1);if(!line)continue;const event=JSON.parse(line);
    if(event.type==='error')throw Error(event.error);
    if(event.type==='progress'){$('adventure-caption').textContent=event.stage?.includes('Expanding')?'Adding bedtime magic...':event.stage?.includes('Checking')?'Putting the final bricks in place...':'Your superhero friends are getting ready!';$('progress-stage').textContent=event.stage;$('progress').value=Math.min(8000,event.characters||0);$('count').textContent=(event.characters||0).toLocaleString()+' / 8,000 characters';}
    if(event.type==='complete'){completed=true;$('heading').textContent='Your adventure is ready! 🎉';$('help').textContent='A grown-up will check your story before you listen.';$('progress-panel').hidden=true;status('All done! Ask your grown-up to check your adventure.');$('next').hidden=true;$('back').hidden=true;}
   }
  }
  if(!completed)throw Error('Story generation ended unexpectedly.');
 }catch(e){status('Oops! Ask a grown-up to help: '+e.message);$('idea-panel').hidden=false;}
 finally{$('next').disabled=false;$('back').disabled=false;}
};
$('surprise').onclick=()=>{$('idea').value='A mysterious glowing brick appears in Bricksburg, and everyone helps find its home before bedtime.';};
$('speak').onclick=()=>{
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech)return status('Speech is not available in this browser. You can type instead.');
 recognition=new Speech();recognition.lang='en-GB';recognition.onresult=e=>{$('idea').value+=($('idea').value?' ':'')+e.results[0][0].transcript;};
 recognition.onerror=e=>status('Microphone: '+e.error);recognition.start();status('Listening to your adventure idea...');
};
(async()=>{try{const [t,a]=await Promise.all([fetch('/api/theme'),fetch('/api/tonies')]);theme=await t.json();tonies=(await a.json()).tonies;render();}catch(e){status('Ask a grown-up to restart StoryBot: '+e.message);}})();
</script></body></html>
